# Visit https://soloterm.com to learn more
name: musa
icon: null
processes:
  Site:
    command: python3 -m http.server 4321 --bind 127.0.0.1
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Marca (rebuild):
    command: node --watch-path=brand/marca.src.html --watch-path=brand/musa-geometry.js --watch-path=brand/musa-eye.js --watch-path=brand/cores.css --watch-path=brand/cores.md --watch-path=brand/tipografia.css brand/export.mjs
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Tailwind:
    command: node --watch-path=index.html --watch-path=mapa.html --watch-path=sobre.html --watch-path=recursos.html --watch-path=navegacao.js --watch-path=dev --watch-path=tailwind.src.css node_modules/@tailwindcss/cli/dist/index.mjs -i tailwind.src.css -o tailwind.css
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
