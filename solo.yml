# Visit https://soloterm.com to learn more
name: musa
icon: null
processes:
  Site:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Marca (rebuild):
    command: node --watch-path=public/brand/marca.src.html --watch-path=public/brand/musa-geometry.js --watch-path=public/brand/musa-eye.js --watch-path=public/brand/cores.css --watch-path=public/brand/cores.md --watch-path=public/brand/tipografia.css public/brand/export.mjs
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Conteúdo (checar planilha):
    command: npm run conteudo:checar
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Conteúdo (importar planilha):
    command: npm run conteudo
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  PDFs (gerar):
    command: npm run pdfs
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
